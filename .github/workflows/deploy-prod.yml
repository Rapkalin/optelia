# Déploiement production — uniquement à la poussée d'un tag.
#
# Une poussée sur main ne déploie rien (décision du 08/11/2026). Pour livrer :
#
#   git tag -a x.y.z -m "…" && git push origin x.y.z   (x.y.z = version de composer.json)
#
# Rien n'est envoyé tant que le tag n'est pas valide et que la CI et CodeQL ne
# sont pas verts : le job de déploiement les attend via `needs`. Un `needs` non
# satisfait n'échoue pas le déploiement, il le **saute** — aucune release
# partielle possible.

name: Déploiement production

on:
  push:
    tags: ['*']

# Un seul déploiement production à la fois. cancel-in-progress est à false :
# interrompre un rsync en cours laisserait la release à moitié écrite.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Le tag doit être la version de composer.json (celle du pied de page et du
  # CHANGELOG) et pointer sur un commit de main : un tag posé ailleurs, ou une
  # version oubliée, n'atteint jamais la production.
  release-tag:
    name: Tag = version de composer.json, sur main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Vérifier le tag
        run: |
          VERSION=$(jq -r .version composer.json)
          if [ "$GITHUB_REF_NAME" != "$VERSION" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à la version $VERSION de composer.json."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le tag $GITHUB_REF_NAME ne pointe pas sur un commit de main."
            exit 1
          fi

  ci:
    name: Contrôles qualité
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  codeql:
    name: Analyse de sécurité
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      actions: read
      security-events: write

  deploy:
    needs: [release-tag, ci, codeql]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      remote_path: prod-optelya
    secrets: inherit
